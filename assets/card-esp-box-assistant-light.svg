<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="esp-box-assistant: Tap-to-talk AI assistant for the ESP32-S3-BOX-3, with remote config and over-the-air updates.">
<style>.fs{font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.fm{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.pulse { animation: p 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.sweep { animation: sw 6s ease-in-out infinite; }
@keyframes p { 0%,100% { opacity:.5; transform:scale(1) } 50% { opacity:0; transform:scale(2.6) } }
@keyframes sw { 0% { transform: translateX(-620px) } 60%,100% { transform: translateX(620px) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".9"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="598" height="248" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c)"><rect width="600" height="250" fill="#FAFAFA"/>
<rect x="0" y="0" width="600" height="2" fill="#E4E4E7"/><rect class="sweep" x="0" y="0" width="600" height="2" fill="url(#sh)"/>
<g transform="translate(32,34)"><rect width="40" height="40" rx="10" fill="#FFFFFF" stroke="#E4E4E7"/><g transform="translate(8,8)" fill="none" stroke="url(#acc)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></g></g>
<g transform="translate(445.4,42)"><rect width="122.6" height="28" rx="14" fill="#FFFFFF" stroke="#E4E4E7"/><circle class="pulse" cx="15" cy="14" r="4" fill="#22C55E"/><circle cx="15" cy="14" r="4" fill="#22C55E"/><text x="27" y="19" class="fm" font-size="14" fill="#52525B">Open source</text></g>
<text x="32" y="118" class="fs" font-size="30" font-weight="700" letter-spacing="-.8" fill="#09090B">esp-box-assistant</text>
<text x="32" y="152" class="fs" font-size="18.5" fill="#52525B">Tap-to-talk AI assistant for the ESP32-S3-BOX-3,</text>
<text x="32" y="178" class="fs" font-size="18.5" fill="#52525B">with remote config and over-the-air updates.</text>
<rect x="32" y="200" width="26.4" height="26" rx="7" fill="#FFFFFF" stroke="#E4E4E7"/><text x="41" y="218" class="fm" font-size="14" fill="#52525B">C</text>
<rect x="66.4" y="200" width="76.8" height="26" rx="7" fill="#FFFFFF" stroke="#E4E4E7"/><text x="75.4" y="218" class="fm" font-size="14" fill="#52525B">ESP-IDF</text>
<rect x="151.2" y="200" width="85.2" height="26" rx="7" fill="#FFFFFF" stroke="#E4E4E7"/><text x="160.2" y="218" class="fm" font-size="14" fill="#52525B">ESP32-S3</text>
<rect x="244.4" y="200" width="43.2" height="26" rx="7" fill="#FFFFFF" stroke="#E4E4E7"/><text x="253.4" y="218" class="fm" font-size="14" fill="#52525B">OTA</text>
</g><rect x=".5" y=".5" width="599" height="249" rx="16" fill="none" stroke="#E4E4E7"/></svg>