<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Jatin Sahni. I build AI systems that see, listen and act.">
<style>.fs{font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.fm{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.flow { stroke-dasharray: 4 8; animation: flow 1.6s linear infinite; }
.blink { animation: blink 1.1s steps(1) infinite; }
.rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
.d1 { animation-delay: .08s } .d2 { animation-delay: .18s } .d3 { animation-delay: .28s } .d4 { animation-delay: .38s }
@keyframes pulse { 0%,100% { opacity:.35; transform:scale(1) } 50% { opacity:.0; transform:scale(2.4) } }
@keyframes flow { to { stroke-dashoffset: -24 } }
@keyframes blink { 50% { opacity: 0 } }
@keyframes rise { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform:none } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
