<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="OutsiderMap: Preference-learning recommendation engine that adapts to what you pick, as you go.">
<style>.fs{font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.fm{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.pulse { animation: p 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.sweep { animation: sw 6s ease-in-out infinite; }
@keyframes p { 0%,100% { opacity:.5; transform:scale(1) } 50% { opacity:0; transform:scale(2.6) } }
@keyframes sw { 0% { transform: translateX(-620px) } 60%,100% { transform: translateX(620px) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".9"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="598" height="248" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c)"><rect width="600" height="250" fill="#FAFAFA"/>
<rect x="0" y="0" width="600" height="2" fill="#E4E4E7"/><rect class="sweep" x="0" y="0" width="600" height="2" fill="url(#sh)"/>
<g transform="translate(32,34)"><rect width="40" height="40" rx="10" fill="#FFFFFF" stroke="#E4E4E7"/><g transform="translate(8,8)" fill="none" stroke="url(#acc)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></g></g>
<g transform="translate(419.6,42)"><rect width="148.4" height="28" rx="14" fill="#FFFFFF" stroke="#E4E4E7"/><circle class="pulse" cx="15" cy="14" r="4" fill="#F59E0B"/><circle cx="15" cy="14" r="4" fill="#F59E0B"/><text x="27" y="19" class="fm" font-size="14" fill="#52525B">In development</text></g>
<text x="32" y="118" class="fs" font-size="30" font-weight="700" letter-spacing="-.8" fill="#09090B">OutsiderMap</text>
<text x="32" y="152" class="fs" font-size="18.5" fill="#52525B">Preference-learning recommendation engine that</text>
<text x="32" y="178" class="fs" font-size="18.5" fill="#52525B">adapts to what you pick, as you go.</text>
<rect x="32" y="200" width="102" height="26" rx="7" fill="#FFFFFF" stroke="#E4E4E7"/><text x="41" y="218" class="fm" font-size="14" fill="#52525B">TypeScript</text>
<rect x="142" y="200" width="144" height="26" rx="7" fill="#FFFFFF" stroke="#E4E4E7"/><text x="151" y="218" class="fm" font-size="14" fill="#52525B">Recommendations</text>
</g><rect x=".5" y=".5" width="599" height="249" rx="16" fill="none" stroke="#E4E4E7"/></svg>